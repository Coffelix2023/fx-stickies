<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>便签菜单外部浮动示意</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    
    .scene {
      position: relative;
      width: 100%;
      max-width: 800px;
    }
    
    /* 便签窗口 */
    .note-window {
      width: 320px;
      height: 400px;
      background: #f5f3e8;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      position: relative;
      overflow: visible; /* 关键：允许子元素溢出 */
    }
    
    /* 顶栏 */
    .note-spine {
      height: 36px;
      background: linear-gradient(to bottom, #e8d4a0, #d9c488);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      cursor: grab;
      border-bottom: 1px solid rgba(28, 25, 21, 0.16);
    }
    
    .note-actions {
      display: flex;
      gap: 4px;
    }
    
    .note-action {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      border-radius: 4px;
      color: #1c1915;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 140ms;
      font-size: 16px;
    }
    
    .note-action:hover {
      background: rgba(255, 255, 255, 0.4);
    }
    
    /* 正文区域 */
    .note-body {
      padding: 16px;
      font-size: 14px;
      color: #1c1915;
      line-height: 1.6;
      height: calc(100% - 36px);
      overflow: auto;
      border-radius: 0 0 10px 10px;
    }
    
    /* macOS 风格菜单 - 浮在便签外部 */
    .menu {
      position: absolute;
      top: 42px;
      right: 8px;
      min-width: 200px;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px) saturate(1.8);
      border: 1px solid rgba(0, 0, 0, 0.12);
      border-radius: 8px;
      box-shadow: 
        0 4px 16px rgba(0, 0, 0, 0.08),
        0 1px 3px rgba(0, 0, 0, 0.05);
      padding: 4px;
      animation: menu-in 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }
    
    @keyframes menu-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .menu-section {
      padding: 0;
    }
    
    .menu-section + .menu-section {
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      margin-top: 4px;
      padding-top: 4px;
    }
    
    .menu-label {
      font-size: 11px;
      color: rgba(0, 0, 0, 0.5);
      padding: 6px 10px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    
    .menu-item {
      height: 28px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 100ms;
      font-size: 13px;
      color: rgba(0, 0, 0, 0.85);
    }
    
    .menu-item:hover {
      background: rgba(0, 0, 0, 0.06);
    }
    
    .menu-item-icon {
      width: 16px;
      text-align: center;
      opacity: 0.6;
    }
    
    .menu-item-check {
      width: 16px;
      text-align: center;
      color: #007AFF;
      font-weight: 600;
    }
    
    /* 色块网格 */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      padding: 6px 10px;
    }
    
    .color-swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 4px;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: all 120ms;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .color-swatch:hover {
      transform: scale(1.1);
      border-color: rgba(0, 0, 0, 0.15);
    }
    
    .color-swatch.selected {
      border-color: rgba(0, 0, 0, 0.3);
    }
    
    .color-swatch.selected::after {
      content: "✓";
      font-size: 12px;
      font-weight: 700;
      color: rgba(0, 0, 0, 0.7);
    }
    
    /* 注释箭头和文字 */
    .annotation {
      position: absolute;
      font-size: 14px;
      color: white;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    
    .annotation::before {
      content: "";
      width: 32px;
      height: 2px;
      background: white;
      opacity: 0.8;
    }
    
    .ann-1 { top: 60px; left: -240px; }
    .ann-2 { top: 250px; right: -260px; }
    .ann-3 { bottom: 60px; left: -220px; }
    
    .ann-2::before { order: 1; }
    
    @media (max-width: 900px) {
      .annotation { display: none; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <!-- 便签窗口 -->
    <div class="note-window">
      <!-- 顶栏 -->
      <div class="note-spine">
        <div style="flex: 1; cursor: grab;"></div>
        <div class="note-actions">
          <button class="note-action">📌</button>
          <button class="note-action">···</button>
        </div>
      </div>
      
      <!-- 正文 -->
      <div class="note-body">
        <h3 style="margin-bottom: 12px;">示例便签</h3>
        <p>这是一张很小的便签窗口（320×400px）。</p>
        <p style="margin-top: 8px;">当点击右上角「···」按钮时，菜单会浮在便签<strong>外部</strong>显示。</p>
      </div>
      
      <!-- macOS 风格菜单 - 关键：浮在便签外部 -->
      <div class="menu">
        <div class="menu-section">
          <div class="menu-label">顶栏</div>
          <div class="menu-item">
            <span class="menu-item-check">✓</span>
            <span>正常</span>
          </div>
          <div class="menu-item">
            <span class="menu-item-check"></span>
            <span>紧凑</span>
          </div>
          <div class="menu-item">
            <span class="menu-item-check"></span>
            <span>极简</span>
          </div>
        </div>
        
        <div class="menu-section">
          <div class="menu-label">纸色</div>
          <div class="color-grid">
            <div class="color-swatch selected" style="background: #f5f3e8;" title="米黄"></div>
            <div class="color-swatch" style="background: #fefefe;" title="纯白"></div>
            <div class="color-swatch" style="background: #ffe4e1;" title="淡粉"></div>
            <div class="color-swatch" style="background: #fff8dc;" title="米白"></div>
            <div class="color-swatch" style="background: #f0fff0;" title="淡绿"></div>
          </div>
        </div>
        
        <div class="menu-section">
          <div class="menu-item">
            <span class="menu-item-icon">🗑</span>
            <span>删除便签</span>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 注释 -->
    <div class="annotation ann-1">
      便签窗口很小（320px 宽）
    </div>
    <div class="annotation ann-2">
      菜单浮在外部，完全可见
    </div>
    <div class="annotation ann-3">
      移除了 overflow-hidden
    </div>
  </div>
</body>
</html>
